<!-- A self-contained maplibre instance with locale switcher -->
<!-- Hover over the attribution button to see the tooltip -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>MapLibre UI Locale Switcher Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
    href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"
    rel="stylesheet"
    />
    <style>
        body { margin: 0; font-family: sans-serif; }
        #map { width: 100vw; height: 90vh; }
        #controls {
            padding: 0.5rem 1rem;
            background: #fff;
            border-bottom: 1px solid #ccc;
        }
        select {
            padding: 0.25rem 0.5rem;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label for="lang-switcher">Language:</label>
        <select id="lang-switcher">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="et">Eesti</option>
            <option value="it">Italiano</option>
            <option value="kw">Kernewek</option>
            <option value="ne">नेपाली</option>
            <option value="pt">Português</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="ja">日本語</option>
            <option value="ru">Русский</option>
        </select>
    </div>
    
    <div id="map"></div>
    
    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
        import { updateMaplibreLocale } from '../dist/maplibre-ui-translations.js';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://demotiles.maplibre.org/globe.json',
            center: [0, 0],
            zoom: 2,
            attributionControl: false, // important: we add our own AttributionControl
        });

        // Controls read map._locale when added, so they must be added after the map exists
        map.on('load', () => {
            map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-left');
            map.addControl(new maplibregl.FullscreenControl(), 'top-left');
            map.addControl(new maplibregl.ScaleControl(), 'bottom-left');
            map.addControl(new maplibregl.AttributionControl({ compact: false }), 'bottom-right');
        });

        document
        .getElementById('lang-switcher')
        .addEventListener('change', e => updateMaplibreLocale(map, e.target.value));
    </script>
</body>
</html>
